# Occlusion benchmark manifest.
#
# Each image is one [[image]] table with these keys:
#
#   file                    string. File name inside this folder, for example "mask-surgical-01.jpg".
#   category                string. One of: none | mask | hand_mouth | hand_eyes | glasses | tilt | no_face_hand | no_face_mask | no_face_object
#   has_face                bool. true when the image shows a face.
#   occlusion               string. One of: none | partial | heavy
#   source_url              string. Page where the image was downloaded.
#   license                 string. CC0-1.0 or PDM-1.0 only.
#   author                  string. Author as credited on the source page.
#   subject_rights_checked  bool. true when the file page carries no restriction flag and declares CC0 or public domain (see README.md; it does not certify consent).
#   notes                   string. Free text.
#
# Rules for entries are in README.md in this folder.
#
# Example entry (commented out):
#
# [[image]]
# file = "mask-surgical-01.jpg"
# category = "mask"
# has_face = true
# occlusion = "partial"
# source_url = "https://commons.wikimedia.org/wiki/File:..."
# license = "CC0-1.0"
# author = ""
# subject_rights_checked = true
# notes = ""

