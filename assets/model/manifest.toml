schema_version = 1

# Benchmark baseline only; not packaged on macOS or Windows. macOS and Windows both package the RetinaFace model below.
[model]
name = "YuNet"
file = "face_detection_yunet_2023mar.onnx"
source = "https://github.com/opencv/opencv_zoo/tree/main/models/face_detection_yunet"
version = "2023mar"
sha256 = "8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4"
size_bytes = 232589
license = "MIT"
license_file = "licenses/inference/YUNET-LICENSE"
input_shape = [1, 3, 640, 640]
input_channels = "BGR"
purpose = "Any-face detection without identity recognition; benchmark baseline only, not packaged"

# App model on macOS and Windows. Replaces YuNet in both packages; YuNet remains the benchmark baseline only.
[model_retinaface]
name = "RetinaFace MobileNet0.25"
file = "face_detection_retinaface_mb025.onnx"
source = "https://media.axelera.ai/artifacts/model_cards/weights/others/object_detection/Retinaface_mb0.25_pytorch.onnx"
sha256 = "f4c83825f41dba8e17b522377f77cb7e2b69ec4df75168d4cb1b18dcaf03b54c"
size_bytes = 1729290
license = "MIT"
license_file = "licenses/inference/RETINAFACE-LICENSE"
input_shape = [1, 3, 640, 640]
input_channels = "BGR"
mean_bgr = [104, 117, 123]
purpose = "Any-face detection without identity recognition; replaces YuNet on macOS and Windows because it keeps detecting faces behind masks and hands (see specs/archived/masked-face-detection-and-lock-on-absence/validation)"

[runtime]
name = "ONNX Runtime"
version = "1.23.0"
platform = "macos-arm64"
source = "https://github.com/microsoft/onnxruntime/releases/download/v1.23.0/onnxruntime-osx-arm64-1.23.0.tgz"
archive_sha256 = "8182db0ebb5caa21036a3c78178f17fabb98a7916bdab454467c8f4cf34bcfdf"
dylib_sha256 = "d3859aecdb70ea099f5b5f4185fe16f0527c6680b18731e6e96fc971ec767cca"
license = "MIT"
notices = "licenses/inference/ONNXRUNTIME-THIRD-PARTY-NOTICES.txt"
default_provider = "CPU"
coreml_policy = "Explicit compute-unit candidate; CPU fallback; energy benefit not verified"

# Windows x64 runtime (specs/archived/windows-version, Phase 5 T070).
# Pins computed locally with tools/inference/fetch-windows-runtime.ps1 -ComputeOnly
# on 2026-10-17 from a fresh download; the GitHub release assets publish no digests.
# The CPU variant is no longer shipped or used by the build; it stays pinned only for
# fetch-windows-runtime.ps1 -Variant cpu. The Windows package ships the DirectML build below.
[runtime.windows-x64.cpu]
version = "1.20.1"
source = "https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-win-x64-1.20.1.zip"
archive_size = 65585496
archive_sha256 = "78d447051e48bd2e1e778bba378bec4ece11191c9e538cf7b2c4a4565e8f5581"
dll = "onnxruntime.dll"
dll_sha256 = "4cb41e89b8bf30578e1dd95e9c40292d61974a4bfcd666409302c4f0c5aa8ce0"
license = "MIT"

# DirectML build (specs/archived/windows-version, Phase 5 T094). The Windows package ships this build as its
# only onnxruntime.dll; it also runs the CPU provider. The device is chosen by the inference_device setting
# (Automatic uses the integrated GPU when a self-test passes, otherwise CPU).
# Pins were computed locally on 2026-10-17 with
# tools/inference/fetch-windows-runtime.ps1 -Variant directml -ComputeOnly; the script refuses placeholders.
# DirectML.dll is the in-box Windows system component and is never redistributed.
[runtime.windows-x64.directml]
version = "1.20.1"
package = "Microsoft.ML.OnnxRuntime.DirectML"
source = "https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime.DirectML/1.20.1"
archive_size = "15844459"
archive_sha256 = "6763468507b7cfc777b1334b3e174c11a540ddacb7bd4354bc2e0ec89e56eec2"
dll = "runtimes/win-x64/native/onnxruntime.dll"
dll_sha256 = "903c92c54acc57caa77d44d4c856c829eb82f5cf6755b47367a8153bd3fabeb6"
license = "MIT"
directml_dll = "system"
